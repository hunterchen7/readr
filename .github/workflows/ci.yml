name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @readr/sync-engine test

  build-web:
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Verify the Expo Web export of apps/mobile builds cleanly and
      # that no native-only module sneaks into the web bundle. Also
      # publishes the bundle size summary to the job log so bundle
      # regressions are visible in PR checks.
      - name: Build Expo Web
        run: pnpm --filter @readr/mobile web:build
      - name: Bundle size summary
        run: |
          du -sh apps/mobile/dist
          find apps/mobile/dist/_expo -type f -name '*.js' | xargs ls -lSh | head -20
      - name: Upload exported web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/mobile/dist
          retention-days: 3

  e2e-web:
    runs-on: ubuntu-latest
    needs: [build-web]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download exported web bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/mobile/dist
      - name: Install Playwright browsers
        run: pnpm --filter @readr/mobile exec playwright install --with-deps chromium
      - name: Run Playwright smoke tests
        run: pnpm --filter @readr/mobile test:web
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/mobile/playwright-report
          retention-days: 7
