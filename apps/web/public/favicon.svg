<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- White rounded-rect background -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="#FFFFFF"/>

  <!-- Open book icon, centered -->
  <g transform="translate(512, 530)">
    <!-- Left page -->
    <path d="M-30,-200 C-30,-200 -30,-200 -30,-200
             L-30,160
             C-30,160 -180,130 -250,160
             L-250,-170
             C-180,-200 -30,-200 -30,-200 Z"
          fill="#1A1A1A"/>

    <!-- Right page -->
    <path d="M30,-200 C30,-200 30,-200 30,-200
             L30,160
             C30,160 180,130 250,160
             L250,-170
             C180,-200 30,-200 30,-200 Z"
          fill="#1A1A1A"/>

    <!-- Spine highlight (thin white line down center) -->
    <line x1="0" y1="-195" x2="0" y2="155" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

    <!-- Subtle page lines on left page -->
    <line x1="-70" y1="-120" x2="-210" y2="-108" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
    <line x1="-70" y1="-60" x2="-215" y2="-50" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
    <line x1="-70" y1="0" x2="-220" y2="8" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
    <line x1="-70" y1="60" x2="-225" y2="65" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.35"/>

    <!-- Subtle page lines on right page -->
    <line x1="70" y1="-120" x2="210" y2="-108" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
    <line x1="70" y1="-60" x2="215" y2="-50" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
    <line x1="70" y1="0" x2="220" y2="8" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
    <line x1="70" y1="60" x2="225" y2="65" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
  </g>
</svg>
