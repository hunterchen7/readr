# Stateful infrastructure stack — run with:
#   docker compose -f deploy/docker-compose.infra.yml up -d
#
# This file holds the always-on services that own data volumes:
# Postgres, Redis, MinIO, and the one-shot bucket bootstrap. App
# redeploys (see docker-compose.app.yml) MUST NOT touch this stack —
# bouncing MinIO during a redeploy briefly 502s books.* through
# Cloudflare and poisons the edge cache, which is exactly the class of
# bug this split exists to prevent.
#
# Both stacks attach to the external `readr` Docker network. Create it
# once on the host before bringing either stack up:
#
#   docker network create readr
#
# Reads environment from the repository root ../.env file.

services:
  postgres:
    image: postgres:16-alpine
    env_file: ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-reader}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - readr
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reader"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    networks:
      - readr

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file: ../.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"  # S3 API (accessible from host for debugging + mobile client)
      - "9001:9001"  # Web console
    volumes:
      - miniodata:/data
    networks:
      - readr
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: create the bucket on startup
  minio-init:
    image: minio/mc:latest
    env_file: ../.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - readr
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/reader-dev || true &&
      mc anonymous set download local/reader-dev &&
      echo 'MinIO bucket reader-dev ready.'
      "

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  readr:
    external: true
