# Stateless application stack — run with:
#   docker compose -f deploy/docker-compose.app.yml up -d --build
#
# This file holds the things we redeploy on every push: the Hono API
# server, future workers, and any public web containers. None of these
# own a data volume — bouncing them is safe and does not affect MinIO,
# Postgres, or Redis (those live in docker-compose.infra.yml).
#
# Prereq: the infra stack must already be running and the shared
# `readr` network must exist:
#
#   docker network create readr           # one-time, on the host
#   docker compose -f deploy/docker-compose.infra.yml up -d
#
# App services reach infra services by their Docker DNS names
# (`postgres`, `redis`, `minio`) over the shared `readr` network.
#
# Reads environment from the repository root ../.env file.

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    env_file: ../.env
    environment:
      # Override any host-specific values from .env to use the in-network service names.
      # These resolve via the shared `readr` network to the infra stack containers.
      DATABASE_URL: postgresql://reader:password@postgres:5432/reader
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      # S3_PUBLIC_ENDPOINT must be set in .env to the externally-reachable
      # MinIO URL (e.g. http://<host-ip>:9000). Without it, presigned URLs
      # are signed against the internal docker hostname and 403 in browsers.
    networks:
      - readr
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Note: the old React+Vite dashboard (`apps/web`) has been removed.
  # The web experience is now served by the Expo Web build of apps/mobile;
  # a matching Dockerfile/service will land in a follow-up PR. For now
  # Caddy only fronts the API.

  # Caddy is optional — only started with `--profile public` so deployments
  # that expose the stack via cloudflared tunnel (no port 80/443 needed)
  # can skip it. On the Olares box in particular ports 80/443 are owned
  # by the host, so we never start Caddy there.
  caddy:
    image: caddy:2-alpine
    profiles: [public]
    depends_on:
      - api
    networks:
      - readr
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

networks:
  readr:
    external: true
