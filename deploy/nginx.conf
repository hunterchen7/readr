# Nginx config for the Expo Web export of apps/mobile.
# The Metro exporter produces a SPA with all routes served from
# index.html — any 404 on a file path that looks like a route
# (/library, /reader/<id>, /book/<id>, etc.) should fall back to
# the root so expo-router can dispatch client-side.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache the hashed JS/CSS chunks — their filenames carry
    # content hashes so cache invalidation is free.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static assets (favicon, icons, fonts) — medium cache.
    location ~* \.(?:ico|png|jpg|jpeg|svg|webp|gif|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback. Anything not matched above rewrites to
    # index.html so expo-router can handle the route client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache the HTML shell itself — Metro stamps a new hash
    # into the script tag on each build and we want clients to pick
    # it up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # The service worker bootstrap file is the one thing clients
    # MUST re-fetch on every deploy — if the browser serves a stale
    # sw.js, a new precache version never activates and the app
    # keeps booting off the old immutable chunks forever. The
    # precached chunks inside the SW are already content-hashed, so
    # no-cache here only costs a single 304 per tab.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # manifest.json changes only on rebuild; we serve a hash-free
    # URL, so force a revalidation each fetch rather than a 7d
    # cache. Cheap and ensures PWA metadata stays fresh.
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }
}
